<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GOStore · 仓库管理</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css?v=20261010-gilroy"><link rel="stylesheet" href="../admin/admin.css?v=20261013-warehouse"><link rel="stylesheet" href="warehouse.css?v=20261013-overview">
<script src="../assets/vendor/qrcode-generator-2.0.4.js" defer></script><script src="../assets/vendor/jsqr-1.4.0.js" defer></script>
<script src="../barcode.js?v=20261013-logistics" defer></script><script src="i18n.js?v=20261013-label" defer></script><script src="warehouse.js?v=20261013-overview" defer></script>
<script src="logistics-ui.js?v=20261013-label" defer></script><script src="qr.js?v=20261013-label" defer></script></head><body>
<section id="login-screen" class="login-screen">
<div class="login-brand"><a href="../"><img src="../assets/logo.png" alt="GOStore"></a><span data-i18n="brand"></span><h1 data-i18n="loginTitle"></h1><p data-i18n="route"></p><div class="brand-shape" aria-hidden="true"></div></div>
<div class="login-wrap"><form id="login-form" class="login-card"><span class="eyebrow" data-i18n="manager"></span><h2 data-i18n="welcome"></h2><p data-i18n="loginIntro"></p>
<label><span data-i18n="warehouse"></span><select id="login-location" name="location"><option value="erenhot" data-i18n="erenhot"></option><option value="ulaanbaatar" data-i18n="ulaanbaatar"></option></select></label>
<label><span data-i18n="email"></span><input name="email" type="email" autocomplete="username" maxlength="200" required></label><label><span data-i18n="password"></span><input name="password" type="password" autocomplete="current-password" required></label>
<p id="login-error" class="error" role="alert"></p><button class="primary" type="submit" data-i18n="login"></button><a href="../" data-i18n="back"></a><small data-i18n="loginHelp"></small></form></div>
</section>
<div id="app" hidden>
<header class="warehouse-header"><a href="../" class="warehouse-logo"><img src="../assets/logo.png" alt="GOStore"></a><div><span class="eyebrow" data-i18n="eyebrow"></span><h1 id="warehouse-title"></h1></div><div class="account"><div><strong data-i18n="manager"></strong><small id="manager-email"></small></div><button id="logout" class="quiet" data-i18n="logout"></button></div></header>
<main class="warehouse-main">
<section class="welcome"><div><span class="eyebrow" data-i18n="route"></span><h2 data-i18n="hero"></h2><p data-i18n="heroHint"></p></div><button class="primary yellow" id="refresh" data-i18n="refresh"></button></section>
<section id="ub-overview" class="warehouse-overview" aria-labelledby="overview-title" hidden>
<h2 id="overview-title">Барааны тойм</h2><div class="overview-grid">
<article class="overview-card"><h3>Сайтаас захиалсан</h3><p><strong id="overview-ordered-quantity">—</strong> ширхэг</p><p class="overview-orders"><span id="overview-ordered-orders">—</span> захиалга</p><small>Цуцлагдаагүй нийт захиалга · бүх хугацаанд</small></article>
<article class="overview-card"><h3>Эрээн агуулахад байгаа</h3><p><strong id="overview-erenhot-quantity">—</strong> ширхэг</p><p class="overview-orders"><span id="overview-erenhot-orders">—</span> захиалга</p><small>Ирсэн болон багцалсан · хараахан илгээгээгүй</small></article>
<article class="overview-card"><h3>Улаанбаатарт ирсэн</h3><p><strong id="overview-ulaanbaatar-quantity">—</strong> ширхэг</p><p class="overview-orders"><span id="overview-ulaanbaatar-orders">—</span> захиалга</p><small>Одоо агуулахад байгаа · ангилах, авах/хүргүүлэхэд бэлэн</small></article>
</div></section>
<section class="scan-panel"><form id="scan-form"><label><span data-i18n="scanLabel"></span><input id="scan-code" autocomplete="off" placeholder="GS- / GB-" maxlength="50" required></label><button class="primary" data-i18n="scanOpen"></button></form><button class="primary" type="button" id="qr-open" data-i18n="qrScan"></button><button class="quiet" id="exceptions-button" data-i18n="exceptions"></button></section><div class="stats warehouse-stats"><button class="stat" data-status="waiting"><span data-i18n="waiting"></span><strong id="waiting-count">0</strong><small data-i18n="waitingHint"></small></button><button class="stat" id="received-stat" data-status="erenhot"><span data-i18n="received"></span><strong id="received-count">0</strong><small data-i18n="receivedHint"></small></button><button class="stat" id="ready-stat" data-status="erenhot_ready" hidden><span data-i18n="readyTitle"></span><strong id="ready-count">0</strong><small data-i18n="readySummary"></small></button><button class="stat" id="third-stat" data-status="erenhot_dispatched"><span data-i18n="third"></span><strong id="third-count">0</strong><small data-i18n="thirdHint"></small></button></div>
<div class="warehouse-tabs"><div role="tablist"><button id="orders-tab" role="tab" aria-selected="true" data-tab="orders" data-i18n="orders"></button><button id="batches-tab" role="tab" aria-selected="false" data-tab="batches" data-i18n="batches"></button></div><button id="create-batch" class="primary" data-i18n="createBatch" hidden></button></div>
<section class="panel orders-panel"><div class="panel-heading"><div><h2 id="list-title"></h2><p id="result-count" role="status"></p></div><span class="tag" id="warehouse-city"></span></div>
<form id="search-form" class="warehouse-search"><label for="search"><span data-i18n="searchLabel"></span><input id="search" name="q" type="search" data-placeholder="searchPlaceholder" maxlength="100" autocomplete="off"></label><label for="status-filter"><span data-i18n="filter"></span><select id="status-filter"></select></label><button class="primary" type="submit" data-i18n="search"></button></form>
<div id="selection-bar" class="selection-bar" hidden><span id="selection-count"></span><button id="pack-selected" class="primary" data-i18n="packSelected"></button></div>
<p id="list-error" class="error" role="alert"></p><div id="records" aria-live="polite"></div><div class="paging"><button id="previous" class="quiet" data-i18n="previous" hidden></button><span id="page-label"></span><button id="next" class="quiet" data-i18n="next" hidden></button></div>
</section></main><footer class="warehouse-footer" data-i18n="footer"></footer></div>
<dialog id="editor" aria-labelledby="editor-title"><div class="dialog-header"><h2 id="editor-title"></h2><button id="close-editor">×</button></div><div id="editor-body"></div></dialog><dialog id="qr-scanner" aria-labelledby="qr-title"><div class="dialog-header"><h2 id="qr-title" data-i18n="qrScan"></h2><button type="button" id="qr-close" data-i18n="close"></button></div><div class="qr-scanner-body"><p data-i18n="qrScanHint"></p><video id="qr-video" autoplay muted playsinline></video><p id="qr-error" class="error" role="alert"></p><button type="button" id="qr-restart" class="quiet" data-i18n="qrRestart"></button><label><span data-i18n="qrImage"></span><input id="qr-file" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="note" data-i18n="qrManual"></p></div></dialog><div id="toast" role="status"></div><section id="print-area"></section>
</body></html>
