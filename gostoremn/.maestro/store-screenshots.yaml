appId: mn.gostore.app
---
- launchApp
- extendedWaitUntil:
    visible: "Үнэ ↑"
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: 01-home
- tapOn:
    point: "30%,94%"
- extendedWaitUntil:
    visible: "Ангиллаар үзэх"
    timeout: 15000
- takeScreenshot: 02-categories
- tapOn:
    point: "50%,94%"
- extendedWaitUntil:
    visible: "Захиалга бүрээ нэг дор"
    timeout: 30000
- takeScreenshot: 05-orders
- tapOn:
    point: "90%,94%"
- extendedWaitUntil:
    visible: "Таны GOStore"
    timeout: 15000
- takeScreenshot: 06-profile
- openLink: gostoremn://brands
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "12 брэнд.*"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Технологи"
- assertVisible: "2 брэнд.*"
- tapOn: "Бүгд"
- assertVisible: "12 брэнд.*"
- takeScreenshot: 07-brands
- openLink: gostoremn://product/tb-1022951227321
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Тойм"
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: 03-product
- tapOn: "Үнэлгээ"
- waitForAnimationToEnd
- assertVisible: "Худалдан авагчдын сэтгэгдэл"
- takeScreenshot: 08-reviews
- tapOn: "Үзүүлэлт"
- waitForAnimationToEnd
- assertVisible: "Товч үзүүлэлт"
- takeScreenshot: 09-specifications
- tapOn: "Санал болгох"
- extendedWaitUntil:
    visible:
      id: "recommendation-grid"
    timeout: 60000
- tapOn: "Санал болгох"
- waitForAnimationToEnd
- takeScreenshot: 10-recommendations
- tapOn: "Сагсанд нэмэх"
- waitForAnimationToEnd
- takeScreenshot: 04-options
