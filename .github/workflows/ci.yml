# Automated checks on every push to main and every pull request. Deployment stays manual (owner
# approval, live-file baseline checks); no production credentials are stored in GitHub.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    name: PHP suites and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, curl, gd, openssl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/ci-php-tests.cjs
        env:
          # Supplier suites need a configured catalog; their network calls are disabled in tests.
          GOSTORE_OTCOMMERCE_API_KEY: ci-placeholder
  app:
    name: Mobile app typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gostoremn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gostoremn/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
  web:
    name: Web lint and bundle freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle matches its sources
        run: |
          node scripts/bundle.cjs
          git diff --exit-code -- app.js app.css index.html || { echo '::error::app.js/app.css/index.html are stale: run node scripts/bundle.cjs and commit the result'; exit 1; }
      - name: ESLint (storefront, admin, warehouse)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund eslint@9.39.5 @eslint/js@9.39.5 globals@14.0.0
          npx eslint -c scripts/eslint-web.config.cjs .
