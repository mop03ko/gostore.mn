<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2793" viewBox="0 0 1900 2793" role="img" aria-labelledby="title desc"><title id="title">Худалдан авалтаас хүлээлгэн өгөх хүртэл</title><desc id="desc">GOStore-ийн кодод тулгуурласан дарааллын диаграм. Дээрээс доош уншина.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#172b46}.message{font-size:18px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}.muted{fill:#586b83}</style><rect width="100%" height="100%" fill="white"/><text x="50" y="54" font-size="18" font-weight="700" fill="#1764c0">GOSTORE / АЖИЛЛАГААНЫ СХЕМ</text><text x="50" y="100" font-size="34" font-weight="700">Худалдан авалтаас хүлээлгэн өгөх хүртэл</text><text x="50" y="133" font-size="18" class="muted">GOStore.mn  /  Төлбөр баталгаажсан захиалгын үргэлжлэл</text><rect x="42" y="245" width="1816" height="578" rx="8" fill="#f0f6ff" fill-opacity="0.5" stroke="#1764c0" stroke-width="1.6"/><rect x="43" y="246" width="1814" height="40" rx="7" fill="#f0f6ff"/><text x="62" y="272" font-size="19" font-weight="700">01  Taobao худалдан авалт, Эрээн хүлээн авалт</text><rect x="42" y="842" width="1816" height="456" rx="8" fill="#f7f3ff" fill-opacity="0.5" stroke="#7354b5" stroke-width="1.6"/><rect x="43" y="843" width="1814" height="40" rx="7" fill="#f7f3ff"/><text x="62" y="869" font-size="19" font-weight="700">02  Эрээн → Замын-Үүд → Улаанбаатар</text><rect x="42" y="1317" width="1816" height="684" rx="8" fill="#fff8ed" fill-opacity="0.5" stroke="#b76b16" stroke-width="1.6"/><rect x="43" y="1318" width="1814" height="40" rx="7" fill="#fff8ed"/><text x="62" y="1344" font-size="19" font-weight="700">03  Үлдэгдэл төлбөр байгаа үед</text><rect x="42" y="2020" width="1816" height="479" rx="8" fill="#eefaf7" fill-opacity="0.5" stroke="#087e75" stroke-width="1.6"/><rect x="43" y="2021" width="1814" height="40" rx="7" fill="#eefaf7"/><text x="62" y="2047" font-size="19" font-weight="700">04  Төлбөр, зөрчил бүрэн шийдэгдсэний дараа</text><line x1="200" y1="224" x2="200" y2="2518" stroke="#8190a4" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="70" y="164" width="260" height="62" rx="12" fill="#eef3fa" stroke="#d2deed"/><text x="200" y="190" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b46">Хэрэглэгч</text><text x="200" y="213" text-anchor="middle" font-size="15" style="fill:#586b83">Вэб / банкны апп</text><line x1="500" y1="224" x2="500" y2="2518" stroke="#8190a4" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="370" y="164" width="260" height="62" rx="12" fill="#1764c0" stroke="#d2deed"/><text x="500" y="190" text-anchor="middle" font-size="21" font-weight="700" style="fill:white">GOStore сервер</text><text x="500" y="213" text-anchor="middle" font-size="15" style="fill:#e0edff">PHP API · SQLite</text><line x1="800" y1="224" x2="800" y2="2518" stroke="#8190a4" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="670" y="164" width="260" height="62" rx="12" fill="#eef3fa" stroke="#d2deed"/><text x="800" y="190" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b46">OT / Taobao</text><text x="800" y="213" text-anchor="middle" font-size="15" style="fill:#586b83">Каталог · худалдан авалт</text><line x1="1100" y1="224" x2="1100" y2="2518" stroke="#8190a4" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="970" y="164" width="260" height="62" rx="12" fill="#eef3fa" stroke="#d2deed"/><text x="1100" y="190" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b46">Эрээн агуулах</text><text x="1100" y="213" text-anchor="middle" font-size="15" style="fill:#586b83">Хүлээн авах · багцлах</text><line x1="1400" y1="224" x2="1400" y2="2518" stroke="#8190a4" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="1270" y="164" width="260" height="62" rx="12" fill="#eef3fa" stroke="#d2deed"/><text x="1400" y="190" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b46">УБ агуулах</text><text x="1400" y="213" text-anchor="middle" font-size="15" style="fill:#586b83">Ангилах · хүлээлгэн өгөх</text><line x1="1700" y1="224" x2="1700" y2="2518" stroke="#8190a4" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="1570" y="164" width="260" height="62" rx="12" fill="#eef3fa" stroke="#d2deed"/><text x="1700" y="190" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b46">QPay</text><text x="1700" y="213" text-anchor="middle" font-size="15" style="fill:#586b83">Merchant V2</text><rect x="796" y="381" width="8" height="27" fill="#1764c0" stroke="white"/><path d="M504 394H795" fill="none" stroke="#1764c0" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="650" y="336" text-anchor="middle"><tspan x="650" dy="0">1. Админы үйлдлээр</tspan><tspan x="650" dy="23">order/render, дараа нь</tspan><tspan x="650" dy="23">order/create</tspan></text><rect x="496" y="480" width="8" height="27" fill="#1764c0" stroke="white"/><path d="M796 493H505" fill="none" stroke="#1764c0" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="650" y="435" text-anchor="middle"><tspan x="650" dy="0">2. Захиалгын дугаар;</tspan><tspan x="650" dy="23">order/tracker-аар тээврийн</tspan><tspan x="650" dy="23">мэдээлэл</tspan></text><rect x="1096" y="556" width="8" height="27" fill="#188451" stroke="white"/><path d="M804 569H1095" fill="none" stroke="#188451" stroke-width="3"  marker-end="url(#arrow)"/><text class="message" x="950" y="534" text-anchor="middle"><tspan x="950" dy="0">3. Барааг Эрээн хаягт хүргэх</tspan><tspan x="950" dy="23">(биет хөдөлгөөн)</tspan></text><rect x="496" y="632" width="8" height="27" fill="#1764c0" stroke="white"/><path d="M1096 645H505" fill="none" stroke="#1764c0" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="800" y="633" text-anchor="middle"><tspan x="800" dy="0">4. GS захиалгыг тулгаж, зурагтай хүлээн авах</tspan></text><rect x="496" y="708" width="8" height="27" fill="#1764c0" stroke="white"/><path d="M1096 721H505" fill="none" stroke="#1764c0" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="800" y="709" text-anchor="middle"><tspan x="800" dy="0">5. Жин, хэмжээ, тоо бүртгэж GB багц үүсгэх</tspan></text><rect x="496" y="784" width="8" height="27" fill="#1764c0" stroke="white"/><path d="M1096 797H505" fill="none" stroke="#1764c0" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="800" y="785" text-anchor="middle"><tspan x="800" dy="0">6. Багц бэлэн болгох; бодитоор гарсныг тусад нь батлах</tspan></text><rect x="1396" y="955" width="8" height="27" fill="#188451" stroke="white"/><path d="M1104 968H1395" fill="none" stroke="#188451" stroke-width="3"  marker-end="url(#arrow)"/><text class="message" x="1250" y="933" text-anchor="middle"><tspan x="1250" dy="0">7. Багцыг Замын-Үүдээр</tspan><tspan x="1250" dy="23">дамжуулан тээвэрлэх</tspan></text><rect x="496" y="1031" width="8" height="27" fill="#7354b5" stroke="white"/><path d="M1396 1044H505" fill="none" stroke="#7354b5" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="950" y="1032" text-anchor="middle"><tspan x="950" dy="0">8. GB QR нээж, GS бараа бүрийг тулган зурагтай хүлээн авах</tspan></text><rect x="496" y="1107" width="8" height="27" fill="#7354b5" stroke="white"/><path d="M1396 1120H505" fill="none" stroke="#7354b5" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="950" y="1108" text-anchor="middle"><tspan x="950" dy="0">9. Агуулахаас авах / хүргүүлэхээр ангилах</tspan></text><rect x="496" y="1183" width="8" height="27" fill="#7354b5" stroke="white"/><path d="M1396 1196H505" fill="none" stroke="#7354b5" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="950" y="1184" text-anchor="middle"><tspan x="950" dy="0">10. Бодит хэмжилт, хадгалсан тарифаар эцсийн тооцоо батлах</tspan></text><rect x="196" y="1259" width="8" height="27" fill="#7354b5" stroke="white"/><path d="M496 1272H205" fill="none" stroke="#7354b5" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="350" y="1237" text-anchor="middle"><tspan x="350" dy="0">11. Миний захиалгууд: явц,</tspan><tspan x="350" dy="23">зураг, төлөх үлдэгдэл</tspan></text><rect x="496" y="1430" width="8" height="27" fill="#b76b16" stroke="white"/><path d="M204 1443H495" fill="none" stroke="#b76b16" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="350" y="1408" text-anchor="middle"><tspan x="350" dy="0">12. Үлдэгдэл төлөх</tspan><tspan x="350" dy="23">(freight-invoice)</tspan></text><rect x="1696" y="1506" width="8" height="27" fill="#b76b16" stroke="white"/><path d="M504 1519H1695" fill="none" stroke="#b76b16" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="1100" y="1507" text-anchor="middle"><tspan x="1100" dy="0">13. Зөвхөн үлдэгдэлд тусдаа /v2/invoice</tspan></text><rect x="496" y="1582" width="8" height="27" fill="#b76b16" stroke="white"/><path d="M1696 1595H505" fill="none" stroke="#b76b16" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="1100" y="1583" text-anchor="middle"><tspan x="1100" dy="0">14. Нэхэмжлэлийн QR, банкны холбоосууд</tspan></text><rect x="196" y="1658" width="8" height="27" fill="#b76b16" stroke="white"/><path d="M496 1671H205" fill="none" stroke="#b76b16" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="350" y="1636" text-anchor="middle"><tspan x="350" dy="0">15. Үлдэгдэл төлбөрийн QR</tspan><tspan x="350" dy="23">харуулах</tspan></text><rect x="1696" y="1734" width="8" height="27" fill="#b76b16" stroke="white"/><path d="M204 1747H1695" fill="none" stroke="#b76b16" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="950" y="1735" text-anchor="middle"><tspan x="950" dy="0">16. Банкны апп-аар үлдэгдэл төлөх</tspan></text><rect x="496" y="1810" width="8" height="27" fill="#b76b16" stroke="white"/><path d="M1696 1823H505" fill="none" stroke="#b76b16" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="1100" y="1811" text-anchor="middle"><tspan x="1100" dy="0">17. freight-callback мэдэгдэл</tspan></text><rect x="1696" y="1886" width="8" height="27" fill="#b76b16" stroke="white"/><path d="M504 1899H1695" fill="none" stroke="#b76b16" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="1100" y="1887" text-anchor="middle"><tspan x="1100" dy="0">18. Үлдэгдлийн гүйлгээг /v2/payment/check-ээр шалгах</tspan></text><rect x="496" y="1962" width="8" height="27" fill="#b76b16" stroke="white"/><path d="M1696 1975H505" fill="none" stroke="#b76b16" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="1100" y="1963" text-anchor="middle"><tspan x="1100" dy="0">19. Баталгаажсан төлсөн дүн</tspan></text><rect x="196" y="2156" width="8" height="27" fill="#087e75" stroke="white"/><path d="M496 2169H205" fill="none" stroke="#087e75" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="350" y="2111" text-anchor="middle"><tspan x="350" dy="0">20. Авахад бэлэн / хүргэлтэд</tspan><tspan x="350" dy="23">гарсан үед 8 оронтой код</tspan><tspan x="350" dy="23">харуулах</tspan></text><rect x="1396" y="2232" width="8" height="27" fill="#087e75" stroke="white"/><path d="M204 2245H1395" fill="none" stroke="#087e75" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="800" y="2233" text-anchor="middle"><tspan x="800" dy="0">21. Нэг удаагийн авах кодоо өгөх</tspan></text><rect x="496" y="2308" width="8" height="27" fill="#087e75" stroke="white"/><path d="M1396 2321H505" fill="none" stroke="#087e75" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="950" y="2309" text-anchor="middle"><tspan x="950" dy="0">22. Код болон хүлээлгэн өгөх нөхцөлийг шалгуулах</tspan></text><rect x="1396" y="2384" width="8" height="27" fill="#087e75" stroke="white"/><path d="M504 2397H1395" fill="none" stroke="#087e75" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="950" y="2385" text-anchor="middle"><tspan x="950" dy="0">23. Баталгаажуулж, захиалгыг completed болгох</tspan></text><rect x="196" y="2460" width="8" height="27" fill="#188451" stroke="white"/><path d="M1396 2473H205" fill="none" stroke="#188451" stroke-width="3"  marker-end="url(#arrow)"/><text class="message" x="800" y="2461" text-anchor="middle"><tspan x="800" dy="0">24. Барааг хүлээлгэн өгөх / хүргэлтээр өгөх</tspan></text><line x1="52" y1="2550" x2="112" y2="2550" stroke="#1764c0" stroke-width="2" marker-end="url(#arrow)"/><text x="125" y="2556" font-size="16">Хүсэлт / үйлдэл</text><line x1="330" y1="2550" x2="390" y2="2550" stroke="#1764c0" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="403" y="2556" font-size="16">Хариу / мэдэгдэл</text><line x1="630" y1="2550" x2="690" y2="2550" stroke="#188451" stroke-width="3" marker-end="url(#arrow)"/><text x="703" y="2556" font-size="16">Биет барааны хөдөлгөөн</text><text x="52" y="2600" font-size="16" class="muted">Taobao автоматаар захиалах нь сонголттой, анхдагчаар унтраалттай. 1688 барааг гараар худалдаж авна.</text><text x="52" y="2627" font-size="16" class="muted">Биет тээврийг API хүсэлтээс ялгаж ногоон сумаар үзүүлэв. Хүргэлтийн ажилтныг УБ талд нэгтгэв.</text><text x="52" y="2654" font-size="16" class="muted">Үлдэгдэл 0 бол III үе шатыг алгасана. Анхны нэхэмжлэлийг өөрчлөхгүй; үлдэгдэлд шинэ нэхэмжлэл гаргана.</text><text x="52" y="2681" font-size="16" class="muted">Код зөвхөн эцсийн тооцоо батлагдсан, өр/буцаалтын зөрүүгүй, нээлттэй зөрчилгүй үед хэрэглэгчид харагдана.</text><text x="52" y="2708" font-size="16" class="muted">Менежер кодыг урьдчилан харахгүй. QR уншуулах нь багцыг нээх бөгөөд хүлээн авалтыг тусад нь батална.</text><text x="52" y="2771" font-size="14" class="muted">Кодын төлөв: 2026-10-19 · Үндсэн амжилттай урсгал · GOStore.mn</text></svg>