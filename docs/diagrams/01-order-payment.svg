<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2245" viewBox="0 0 1600 2245" role="img" aria-labelledby="title desc"><title id="title">Захиалга ба төлбөр</title><desc id="desc">GOStore-ийн кодод тулгуурласан дарааллын диаграм. Дээрээс доош уншина.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#172b46}.message{font-size:18px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}.muted{fill:#586b83}</style><rect width="100%" height="100%" fill="white"/><text x="50" y="54" font-size="18" font-weight="700" fill="#1764c0">GOSTORE / АЖИЛЛАГААНЫ СХЕМ</text><text x="50" y="100" font-size="34" font-weight="700">Захиалга ба төлбөр</text><text x="50" y="133" font-size="18" class="muted">GOStore.mn  /  Үндсэн сагсны захиалгын амжилттай урсгал</text><rect x="42" y="245" width="1516" height="555" rx="8" fill="#f0f6ff" fill-opacity="0.5" stroke="#1764c0" stroke-width="1.6"/><rect x="43" y="246" width="1514" height="40" rx="7" fill="#f0f6ff"/><text x="62" y="272" font-size="19" font-weight="700">01  Бараа сонгох, захиалга үүсгэх</text><rect x="42" y="819" width="1516" height="456" rx="8" fill="#f7f3ff" fill-opacity="0.5" stroke="#7354b5" stroke-width="1.6"/><rect x="43" y="820" width="1514" height="40" rx="7" fill="#f7f3ff"/><text x="62" y="846" font-size="19" font-weight="700">02  QPay нэхэмжлэл үүсгэх</text><rect x="42" y="1294" width="1516" height="684" rx="8" fill="#eefaf7" fill-opacity="0.5" stroke="#087e75" stroke-width="1.6"/><rect x="43" y="1295" width="1514" height="40" rx="7" fill="#eefaf7"/><text x="62" y="1321" font-size="19" font-weight="700">03  Төлбөрийг шалгаж баталгаажуулах</text><line x1="200" y1="224" x2="200" y2="1997" stroke="#8190a4" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="70" y="164" width="260" height="62" rx="12" fill="#eef3fa" stroke="#d2deed"/><text x="200" y="190" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b46">Хэрэглэгч</text><text x="200" y="213" text-anchor="middle" font-size="15" style="fill:#586b83">Вэб / банкны апп</text><line x1="500" y1="224" x2="500" y2="1997" stroke="#8190a4" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="370" y="164" width="260" height="62" rx="12" fill="#eef3fa" stroke="#d2deed"/><text x="500" y="190" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b46">GOStore вэб</text><text x="500" y="213" text-anchor="middle" font-size="15" style="fill:#586b83">Сагс · checkout · бүртгэл</text><line x1="800" y1="224" x2="800" y2="1997" stroke="#8190a4" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="670" y="164" width="260" height="62" rx="12" fill="#1764c0" stroke="#d2deed"/><text x="800" y="190" text-anchor="middle" font-size="21" font-weight="700" style="fill:white">GOStore сервер</text><text x="800" y="213" text-anchor="middle" font-size="15" style="fill:#e0edff">PHP API · SQLite</text><line x1="1100" y1="224" x2="1100" y2="1997" stroke="#8190a4" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="970" y="164" width="260" height="62" rx="12" fill="#eef3fa" stroke="#d2deed"/><text x="1100" y="190" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b46">QPay</text><text x="1100" y="213" text-anchor="middle" font-size="15" style="fill:#586b83">Merchant V2</text><line x1="1400" y1="224" x2="1400" y2="1997" stroke="#8190a4" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="1270" y="164" width="260" height="62" rx="12" fill="#eef3fa" stroke="#d2deed"/><text x="1400" y="190" text-anchor="middle" font-size="21" font-weight="700" style="fill:#172b46">OT / Taobao</text><text x="1400" y="213" text-anchor="middle" font-size="15" style="fill:#586b83">Каталог · худалдан авалт</text><rect x="496" y="358" width="8" height="27" fill="#1764c0" stroke="white"/><path d="M204 371H495" fill="none" stroke="#1764c0" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="350" y="336" text-anchor="middle"><tspan x="350" dy="0">1. Бараа, хувилбар, тоо</tspan><tspan x="350" dy="23">болон авах хэлбэр сонгох</tspan></text><rect x="796" y="434" width="8" height="27" fill="#1764c0" stroke="white"/><path d="M504 447H795" fill="none" stroke="#1764c0" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="650" y="412" text-anchor="middle"><tspan x="650" dy="0">2. Үнэ тооцуулах / захиалах</tspan><tspan x="650" dy="23">хүсэлт</tspan></text><rect x="1396" y="510" width="8" height="27" fill="#1764c0" stroke="white"/><path d="M804 523H1395" fill="none" stroke="#1764c0" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="1100" y="511" text-anchor="middle"><tspan x="1100" dy="0">3. Үнэ, SKU, үлдэгдлийг дахин шалгах</tspan></text><rect x="796" y="586" width="8" height="27" fill="#1764c0" stroke="white"/><path d="M1396 599H805" fill="none" stroke="#1764c0" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="1100" y="587" text-anchor="middle"><tspan x="1100" dy="0">4. Барааны баталгаажуулсан мэдээлэл</tspan></text><rect x="796" y="685" width="8" height="27" fill="#1764c0" stroke="white"/><path d="M804 680h38v18h-38" fill="none" stroke="#1764c0" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="855" y="640" text-anchor="start"><tspan x="855" dy="0">5. Нийт дүнг тооцож, GS</tspan><tspan x="855" dy="23">захиалгыг quoted төлөвөөр</tspan><tspan x="855" dy="23">хадгалах</tspan></text><rect x="496" y="761" width="8" height="27" fill="#1764c0" stroke="white"/><path d="M796 774H505" fill="none" stroke="#1764c0" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="650" y="739" text-anchor="middle"><tspan x="650" dy="0">6. Захиалгын дугаар, төлөх</tspan><tspan x="650" dy="23">дүн</tspan></text><rect x="796" y="932" width="8" height="27" fill="#7354b5" stroke="white"/><path d="M504 945H795" fill="none" stroke="#7354b5" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="650" y="933" text-anchor="middle"><tspan x="650" dy="0">7. Нэхэмжлэл авах (invoice)</tspan></text><rect x="1096" y="1008" width="8" height="27" fill="#7354b5" stroke="white"/><path d="M804 1021H1095" fill="none" stroke="#7354b5" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="950" y="986" text-anchor="middle"><tspan x="950" dy="0">8. Нэхэмжлэл үүсгэх</tspan><tspan x="950" dy="23">/v2/invoice</tspan></text><rect x="796" y="1084" width="8" height="27" fill="#7354b5" stroke="white"/><path d="M1096 1097H805" fill="none" stroke="#7354b5" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="950" y="1062" text-anchor="middle"><tspan x="950" dy="0">9. invoice_id, QR, банкны</tspan><tspan x="950" dy="23">холбоосууд</tspan></text><rect x="496" y="1160" width="8" height="27" fill="#7354b5" stroke="white"/><path d="M796 1173H505" fill="none" stroke="#7354b5" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="650" y="1138" text-anchor="middle"><tspan x="650" dy="0">10. Нэхэмжлэл хадгалж, QR</tspan><tspan x="650" dy="23">буцаах</tspan></text><rect x="196" y="1236" width="8" height="27" fill="#7354b5" stroke="white"/><path d="M496 1249H205" fill="none" stroke="#7354b5" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="350" y="1214" text-anchor="middle"><tspan x="350" dy="0">11. Төлөх дүн, QR болон</tspan><tspan x="350" dy="23">банкны сонголт</tspan></text><rect x="1096" y="1407" width="8" height="27" fill="#087e75" stroke="white"/><path d="M204 1420H1095" fill="none" stroke="#087e75" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="650" y="1408" text-anchor="middle"><tspan x="650" dy="0">12. Банкны апп-аар төлөх (нэгтгэн үзүүлэв)</tspan></text><rect x="796" y="1483" width="8" height="27" fill="#087e75" stroke="white"/><path d="M1096 1496H805" fill="none" stroke="#087e75" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="950" y="1461" text-anchor="middle"><tspan x="950" dy="0">13. Төлбөрийн callback</tspan><tspan x="950" dy="23">мэдэгдэл</tspan></text><rect x="1096" y="1559" width="8" height="27" fill="#087e75" stroke="white"/><path d="M804 1572H1095" fill="none" stroke="#087e75" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="950" y="1537" text-anchor="middle"><tspan x="950" dy="0">14. Серверээс шалгах</tspan><tspan x="950" dy="23">/v2/payment/check</tspan></text><rect x="796" y="1635" width="8" height="27" fill="#087e75" stroke="white"/><path d="M1096 1648H805" fill="none" stroke="#087e75" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="950" y="1636" text-anchor="middle"><tspan x="950" dy="0">15. Төлсөн гүйлгээ, MNT дүн</tspan></text><rect x="796" y="1711" width="8" height="27" fill="#087e75" stroke="white"/><path d="M804 1706h38v18h-38" fill="none" stroke="#087e75" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="855" y="1689" text-anchor="start"><tspan x="855" dy="0">16. Дүн хүрсэн үед paid =</tspan><tspan x="855" dy="23">true, status = confirmed</tspan></text><rect x="796" y="1787" width="8" height="27" fill="#087e75" stroke="white"/><path d="M504 1800H795" fill="none" stroke="#087e75" stroke-width="1.8"  marker-end="url(#arrow)"/><text class="message" x="650" y="1765" text-anchor="middle"><tspan x="650" dy="0">17. Төлөв шинэчлэх</tspan><tspan x="650" dy="23">(payment-check)</tspan></text><rect x="496" y="1863" width="8" height="27" fill="#087e75" stroke="white"/><path d="M796 1876H505" fill="none" stroke="#087e75" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="650" y="1841" text-anchor="middle"><tspan x="650" dy="0">18. Баталгаажсан захиалгын</tspan><tspan x="650" dy="23">төлөв</tspan></text><rect x="196" y="1939" width="8" height="27" fill="#087e75" stroke="white"/><path d="M496 1952H205" fill="none" stroke="#087e75" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="message" x="350" y="1917" text-anchor="middle"><tspan x="350" dy="0">19. Төлбөр баталгаажсан</tspan><tspan x="350" dy="23">мэдээлэл</tspan></text><line x1="52" y1="2029" x2="112" y2="2029" stroke="#1764c0" stroke-width="2" marker-end="url(#arrow)"/><text x="125" y="2035" font-size="16">Хүсэлт / үйлдэл</text><line x1="330" y1="2029" x2="390" y2="2029" stroke="#1764c0" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="403" y="2035" font-size="16">Хариу / мэдэгдэл</text><line x1="630" y1="2029" x2="690" y2="2029" stroke="#188451" stroke-width="3" marker-end="url(#arrow)"/><text x="703" y="2035" font-size="16">Биет барааны хөдөлгөөн</text><text x="52" y="2079" font-size="16" class="muted">Эхний төлбөр = бараа + Хятад доторх хүргэлт + үйлчилгээ. Каргоны эцсийн тооцоо УБ-д гарна.</text><text x="52" y="2106" font-size="16" class="muted">Callback нь мэдэгдэл: сервер QPay-ээс гүйлгээ, төлөв, валют, нийт төлсөн дүнг шалгаж байж батална.</text><text x="52" y="2133" font-size="16" class="muted">Үнэ өөрчлөгдвөл 409 хариугаар шинэ дүнг харуулна. Хугацаа дууссан төлөгдөөгүй захиалгыг цуцална.</text><text x="52" y="2160" font-size="16" class="muted">Банкны апп ба QPay-ийн дотоод харилцааг нэгтгэв. Энэ нь кодын схем; бодит гүйлгээний туршилтын тайлан биш.</text><text x="52" y="2223" font-size="14" class="muted">Кодын төлөв: 2026-10-19 · Үндсэн амжилттай урсгал · GOStore.mn</text></svg>